<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spine 工作台</title>
<style>
  :root{
    --bg:#f4f3ef; --card:#fff; --line:#e2e0d8; --ink:#2c2c2a; --dim:#6b6a63;
    --ok:#1d7a5f; --warn:#9a6b12; --bad:#a33; --accent:#2f6f5e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;background:var(--card);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{font-size:15px;font-weight:600;margin:0}
  header .sub{color:var(--dim);font-size:12px}
  .pill{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;
    border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:#fbfaf7}
  .dot{width:7px;height:7px;border-radius:50%;background:#c9c7bd;flex:none}
  .dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
  main{display:grid;grid-template-columns:410px 1fr;gap:18px;padding:18px;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .panel h2{font-size:13px;font-weight:600;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:8px;background:#fbfaf7}
  .panel h2 .hint{margin-left:auto;font-weight:400;color:var(--dim);font-size:11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
  .env{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:12px 14px;font-size:12px}
  .env div{display:flex;align-items:center;gap:7px;color:var(--dim);min-width:0}
  .env .wide{grid-column:1/-1}
  .env .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
  .env b{font-weight:500;color:var(--ink);white-space:nowrap;flex:none}
  .steps{list-style:none;margin:0;padding:0}
  .step{padding:11px 14px;border-bottom:1px solid var(--line);display:grid;
    grid-template-columns:1fr auto;gap:4px 10px}
  .step:last-child{border-bottom:0}
  .step .t{font-weight:600;font-size:13px}
  .step .d{color:var(--dim);font-size:12px;grid-column:1}
  .step .meta{grid-column:1;font-size:11px;color:var(--dim)}
  .step button{grid-row:1/span 2;grid-column:2;align-self:center;
    background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 14px;
    font-size:12px;cursor:pointer;min-width:64px}
  .step button:disabled{background:#d6d4cb;cursor:not-allowed}
  .step.running{background:#f8f6ee}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;
    border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:1px}
  .tag.need{color:var(--warn);border-color:#e6d3a8;background:#fdf7e8}
  .toolbar{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:#fbfaf7}
  .toolbar button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;
    font-size:12px;cursor:pointer}
  .toolbar button:hover{border-color:#c9c6bb}
  #log{height:290px;overflow:auto;margin:0;padding:12px 14px;font:12px/1.55 ui-monospace,Menlo,monospace;
    white-space:pre-wrap;word-break:break-all;background:#23262e;color:#d7dae0}
  #log .cmd{color:#8fd3b6} #log .err{color:#ff9c8a}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px}
  .art{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f7f6f2}
  .art img{display:block;width:100%;height:140px;object-fit:contain;
    background:repeating-conic-gradient(#ecebe5 0% 25%,#f8f8f6 0% 50%) 50%/16px 16px}
  .art .cap{padding:6px 8px;font-size:11px;color:var(--dim);display:flex;gap:6px;align-items:center}
  .art .cap span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .art .cap a{color:var(--accent);text-decoration:none;margin-left:auto;flex:none}
  .empty{padding:18px 14px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Spine 工作台</h1>
    <div class="sub">生成 → 分件 → 标定 → 绑骨 → 打包 → 校验；产物都在 <code>repro/</code> 下</div>
  </div>
  <div class="pill"><span id="cdot" class="dot"></span><span id="ctext">检测中</span></div>
</header>

<main>
  <div style="display:grid;gap:18px">
    <section class="panel">
      <h2>环境<span class="hint">本机</span></h2>
      <div class="env" id="env"></div>
    </section>

    <section class="panel">
      <h2>流水线<span class="hint">①② 在 ComfyUI 里跑</span></h2>
      <ul class="steps" id="steps"></ul>
      <div class="toolbar">
        <button id="runAll">跑一遍本地步骤</button>
        <button id="openPreview">spine 预览</button>
        <button id="refresh">刷新</button>
      </div>
    </section>
  </div>

  <div style="display:grid;gap:18px">
    <section class="panel">
      <h2>日志<span class="hint" id="loghint">空闲</span></h2>
      <pre id="log"></pre>
    </section>
    <section class="panel">
      <h2>产物<span class="hint">点缩略图看原图</span></h2>
      <div class="gallery" id="gallery"><div class="empty">还没有产物。</div></div>
    </section>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const LOG = $('#log');
let state = null, running = false, current = null;

function log(text, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text + '\n';
  LOG.appendChild(span);
  LOG.scrollTop = LOG.scrollHeight;
}

async function loadState() {
  const r = await fetch('/api/state');
  state = await r.json();
  const e = state.env;
  $('#cdot').className = 'dot ' + (e.up ? 'on' : 'off');
  $('#ctext').textContent = e.up ? 'ComfyUI ' + (e.version || '') : 'ComfyUI 未启动';
  $('#ctext').title = e.url + (e.error ? ' · ' + e.error : '');
    const rows = [
    [e.up, 'ComfyUI 服务', e.up ? (e.version || 'up') : '未启动'],
    [e.checkpoints.length > 0, '底模', e.checkpoints.length ? e.checkpoints.length + ' 个' : '空'],
    [e.seethrough, 'See-through 节点', e.seethrough ? '已装' : '未装'],
    [e.dwpose, 'DWPose 节点', e.dwpose ? '已装' : '未装'],
    [e.spine_core, 'spine-core 4.2', e.spine_core ? '已装' : '缺'],
    [e.ffmpeg, 'ffmpeg', e.ffmpeg ? '已装' : '缺'],
  ];
  $('#env').innerHTML = rows.map(([ok, k, v]) =>
    `<div><span class="dot ${ok ? 'on' : 'off'}"></span><b>${k}</b><span>${v}</span></div>`).join('')
    + `<div class="wide"><span class="dot ${e.dir ? 'on' : 'off'}"></span><b>安装目录</b>
       <span class="path" title="${e.dir || ''}">${e.dir || '未找到'}</span></div>`;
  renderSteps();
  renderGallery();
}

function renderSteps() {
  const ul = $('#steps');
  ul.innerHTML = '';
  for (const s of state.steps) {
    const li = document.createElement('li');
    li.className = 'step' + (s.id === current ? ' running' : '');
    const reasons = s.blocked.join(' · ');
    li.innerHTML = `<div class="t">${s.name}${reasons ? `<span class="tag need">${reasons}</span>` : ''}</div>
      <div class="d">${s.desc}</div>
      <div class="meta">${s.artifacts.length ? s.artifacts.length + ' 个产物' : (s.has_cmd ? '暂无产物' : '待接 ComfyUI 工作流')}</div>`;
    const b = document.createElement('button');
    b.textContent = s.id === current ? '运行中' : '运行';
    b.disabled = running || s.blocked.length > 0 || !s.has_cmd;
    b.onclick = () => runStep(s.id);
    li.appendChild(b);
    ul.appendChild(li);
  }
}

function renderGallery() {
  const g = $('#gallery');
  const items = state.steps.flatMap(s => s.artifacts);
  if (!items.length) { g.innerHTML = '<div class="empty">还没有产物。先跑 ③ 清理 + 测量。</div>'; return; }
  g.innerHTML = '';
  for (const a of items) {
    const url = '/api/file?p=' + encodeURIComponent(a.rel);
    const isImg = /\.(png|jpe?g|gif|webp)$/i.test(a.name);
    const el = document.createElement('div');
    el.className = 'art';
    el.innerHTML = isImg
      ? `<a href="${url}" target="_blank"><img src="${url}" loading="lazy" alt="${a.name}"></a>`
      : `<div style="height:140px;display:grid;place-items:center;color:#9a988f;font-size:12px">${a.name}</div>`;
    el.innerHTML += `<div class="cap"><span>${a.name}</span><a href="${url}" target="_blank">打开</a></div>`;
    g.appendChild(el);
  }
}

function streamStep(id) {
  return new Promise(resolve => {
    const es = new EventSource('/api/run?step=' + encodeURIComponent(id));
    es.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'line') log(m.text, m.text.startsWith('$ ') ? 'cmd' : '');
      if (m.type === 'done') { es.close(); resolve(m.ok); }
    };
    es.onerror = () => { es.close(); resolve(false); };
  });
}

async function runStep(id) {
  if (running) return;
  running = true; current = id; renderSteps();
  $('#loghint').textContent = '运行中';
  LOG.textContent = '';
  const ok = await streamStep(id);
  log(ok ? '\n完成。' : '\n失败，看上面的输出。', ok ? 'cmd' : 'err');
  running = false; current = null;
  $('#loghint').textContent = ok ? '完成' : '失败';
  loadState();
}

$('#refresh').onclick = loadState;
$('#openPreview').onclick = () =>
  window.open('/api/file?p=' + encodeURIComponent('p1/out/rig/preview.html'), '_blank');
$('#runAll').onclick = async () => {
  if (running) return;
  running = true; renderSteps();
  LOG.textContent = '';
  for (const id of ['measure', 'compose', 'rig', 'pack', 'verify']) {
    log('\n=== ' + id + ' ===', 'cmd');
    await streamStep(id);
  }
  running = false; current = null;
  $('#loghint').textContent = '完成';
  loadState();
};

loadState();
setInterval(() => { if (!running) loadState(); }, 6000);
</script>
</body>
</html>
